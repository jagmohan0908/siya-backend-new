services:
  - type: web
    name: siya-backend-new-dev
    runtime: node
    branch: main
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: BOOKINGS_ENABLED
        value: "false"
      - key: ERP_URL
        value: https://dev-sr.butest.tech
      - key: ERP_TOKEN
        sync: false
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_STOREFRONT_TOKEN
        sync: false
